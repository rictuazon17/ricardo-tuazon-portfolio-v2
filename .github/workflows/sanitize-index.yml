name: Sanitize portfolio HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove accidental Markdown fences from HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          changed = False
          while lines and not lines[0].strip():
              lines.pop(0)
          if lines and lines[0].strip().lower() in {'```html', '```htm', '```'}:
              lines.pop(0)
              changed = True
          while lines and not lines[-1].strip():
              lines.pop()
          if lines and lines[-1].strip() == '```':
              lines.pop()
              changed = True
          cleaned = '\n'.join(lines).rstrip() + '\n'
          if cleaned != s:
              p.write_text(cleaned, encoding='utf-8')
              changed = True
          print(f'index.html sanitized: {changed}')
          PY

      - name: Validate HTML structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8').lstrip()
          assert s.startswith('<!DOCTYPE html>'), 'index.html must start with <!DOCTYPE html>'
          assert '</html>' in s, 'index.html is missing </html>'
          assert '```' not in s, 'Markdown fence remains in index.html'
          print('HTML structure validation passed')
          PY

      - name: Commit sanitized file
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No sanitization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove markdown fences from index.html'
          git push
